# Traceback LMS. One command: docker compose up --build
#   web  -> http://localhost:5173
#   api  -> http://localhost:3000   (Swagger UI: /docs)
name: traceback-lms

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: docker-demo-secret-change-me-for-real-use
      SEED_ADMIN_PASSWORD: Password123!
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: lms_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
